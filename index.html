<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#150029">
<link rel="manifest" href="manifest.json">
<title>NEON TETRIS v1.9</title>
<style>
  :root {
    --cell: 38px;
    --cols: 10;
    --rows: 20;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: radial-gradient(ellipse at center, #1b0033 0%, #05000f 70%, #000000 100%);
    color: #fff;
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 40px;
    height: 100vh;
    width: 100%;
    flex-wrap: wrap;
    padding-top: 8px;
  }
  .panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
  }
  h1 {
    font-size: 2.1rem;
    margin: 0;
    letter-spacing: 6px;
    background: linear-gradient(90deg, #ff2ee6, #00e5ff, #ffe600, #00ff85, #ff2ee6);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: hueflow 6s linear infinite;
    text-align: center;
    text-shadow: 0 0 30px rgba(255,255,255,0.15);
  }
  @keyframes hueflow {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }
  #boardWrap {
    position: relative;
    padding: 14px;
    border-radius: 18px;
    background: linear-gradient(145deg, #150029, #0a0018);
    box-shadow:
      0 0 0 3px #ff2ee6,
      0 0 25px 6px rgba(255, 46, 230, 0.55),
      inset 0 0 40px rgba(0, 229, 255, 0.15);
  }
  canvas#board {
    display: block;
    background: #08000f;
    border-radius: 8px;
    image-rendering: pixelated;
    touch-action: none;
  }
  #overlay {
    position: absolute;
    inset: 14px;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    background: rgba(5, 0, 15, 0.85);
    border-radius: 8px;
    text-align: center;
    padding: 20px;
  }
  #overlay h2 {
    font-size: 2rem;
    margin: 0;
    color: #ffe600;
    text-shadow: 0 0 12px #ffe600;
  }
  #overlay p { margin: 0; color: #9be8ff; font-size: 1.1rem; }
  #overlay button {
    margin-top: 10px;
  }
  .side {
    display: flex;
    flex-direction: row;
    gap: 14px;
    align-items: stretch;
  }
  .box {
    background: linear-gradient(145deg, #150029, #0a0018);
    border-radius: 14px;
    padding: 10px 20px;
    box-shadow: 0 0 0 2px #00e5ff, 0 0 18px rgba(0, 229, 255, 0.45);
    text-align: center;
    min-width: 90px;
  }
  .box h3 {
    margin: 0 0 6px 0;
    font-size: 0.8rem;
    letter-spacing: 3px;
    color: #00e5ff;
    text-transform: uppercase;
  }
  .stat {
    font-size: 1.7rem;
    font-weight: bold;
    color: #ffe600;
    text-shadow: 0 0 10px rgba(255, 230, 0, 0.5);
    transition: color 0.2s ease, text-shadow 0.2s ease;
  }
  .stat.newBest {
    color: #00ff85;
    text-shadow: 0 0 16px rgba(0, 255, 133, 0.95), 0 0 30px rgba(0, 255, 133, 0.5);
    animation: bestPulse 0.5s ease;
  }
  @keyframes bestPulse {
    0% { transform: scale(1); }
    40% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  button {
    font-family: inherit;
    font-size: 1rem;
    font-weight: bold;
    letter-spacing: 2px;
    padding: 12px 22px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background: linear-gradient(90deg, #ff2ee6, #00e5ff);
    color: #05000f;
    box-shadow: 0 0 18px rgba(255, 46, 230, 0.6);
    transition: transform 0.1s ease;
  }
  button:hover { transform: scale(1.05); }
  button:active { transform: scale(0.97); }

  /* ---------- Mobile layout ---------- */
  body.mobile { overflow: hidden; }
  body.mobile #app {
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    gap: 6px;
    padding-top: 4px;
    padding-left: max(10px, env(safe-area-inset-left, 0px));
    padding-right: max(10px, env(safe-area-inset-right, 0px));
    height: 100dvh;
    box-sizing: border-box;
    overflow-y: auto;
  }
  body.mobile h1 {
    font-size: 1.3rem;
    letter-spacing: 3px;
  }
  body.mobile .panel { gap: 6px; }
  body.mobile #boardWrap { padding: 6px; border-radius: 12px; }
  body.mobile .side {
    gap: 10px;
  }
  body.mobile .box {
    padding: 6px 14px;
    border-radius: 10px;
    min-width: 70px;
  }
  body.mobile .box h3 { font-size: 0.6rem; margin-bottom: 2px; }
  body.mobile .stat { font-size: 1.2rem; }
  body.mobile #boardWrap {
    box-shadow:
      0 0 0 2px #ff2ee6,
      0 0 12px 3px rgba(255, 46, 230, 0.5),
      inset 0 0 20px rgba(0, 229, 255, 0.12);
  }

  .mobilePause {
    display: none;
    width: 56px;
    height: 56px;
    min-width: 44px;
    min-height: 44px;
    padding: 0;
    font-size: 1.4rem;
    border-radius: 14px;
    align-items: center;
    justify-content: center;
    margin-top: 6px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body.mobile .mobilePause { display: flex; }
  body.mobile #boardWrap {
    padding-left: max(6px, env(safe-area-inset-left, 0px));
    padding-right: max(6px, env(safe-area-inset-right, 0px));
  }

  @media (max-width: 900px) {
    :root { --cell: 26px; }
    h1 { font-size: 2rem; }
  }

  h1 .ver {
    display: block;
    font-size: 0.9rem;
    letter-spacing: 3px;
    margin-top: 2px;
    background: none;
    -webkit-text-fill-color: initial;
    color: #7de8ff;
    text-shadow: 0 0 8px rgba(125, 232, 255, 0.6);
    animation: none;
  }
  body.mobile h1 .ver { font-size: 0.65rem; }
</style>
</head>
<body>
<div id="app">
  <div class="panel">
    <h1>NEON TETRIS<span class="ver">v1.9</span></h1>
    <div id="boardWrap">
      <canvas id="board"></canvas>
      <div id="overlay">
        <h2 id="overlayTitle">PAUSED</h2>
        <p id="overlaySub">Press P to resume</p>
        <button id="overlayBtn">RESUME</button>
      </div>
    </div>
    <div class="side">
      <div class="box">
        <h3>Score</h3>
        <div class="stat" id="score">0</div>
      </div>
      <div class="box">
        <h3>Best</h3>
        <div class="stat" id="best">0</div>
      </div>
    </div>
    <button id="tPause" class="mobilePause">II</button>
  </div>
</div>

<script>
(function(){
  const COLS = 10, ROWS = 20;

  // ---- Device detection: touch/coarse-pointer + narrow viewport counts as mobile ----
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 || window.matchMedia('(pointer: coarse)').matches;
  const isNarrow = window.matchMedia('(max-width: 900px)').matches;
  const isMobile = isTouch && isNarrow;
  if (isMobile) document.body.classList.add('mobile');

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');

  let CELL;
  function computeCell(){
    if (isMobile) {
      // Measure the real height of everything sharing the column with the
      // board (title, score/best row, pause button, gaps) instead of a
      // hardcoded guess — this stays correct even as UI elements change.
      const app = document.getElementById('app');
      const panel = document.querySelector('.panel');
      const title = document.querySelector('h1');
      const boardWrap = document.getElementById('boardWrap');
      const side = document.querySelector('.side');
      const pauseBtn = document.getElementById('tPause');

      const appStyle = getComputedStyle(app);
      const panelStyle = getComputedStyle(panel);
      const boardWrapStyle = getComputedStyle(boardWrap);
      const pauseVisible = getComputedStyle(pauseBtn).display !== 'none';

      const rowGap = parseFloat(panelStyle.rowGap || panelStyle.gap) || 0;
      const gapCount = 1 + 1 + (pauseVisible ? 1 : 0); // title→board, board→side, side→pause

      const chromeHeight =
        parseFloat(appStyle.paddingTop) +
        title.offsetHeight +
        parseFloat(boardWrapStyle.paddingTop) + parseFloat(boardWrapStyle.paddingBottom) +
        side.offsetHeight +
        (pauseVisible ? pauseBtn.offsetHeight : 0) +
        (rowGap * gapCount) +
        14; // safety buffer for rounding / sub-pixel layout

      const horizontalReserve = 50; // #app padding (20) + #boardWrap padding (12) + glow bleed margin
      const availW = document.documentElement.clientWidth - horizontalReserve;
      const availH = window.innerHeight - chromeHeight;
      CELL = Math.floor(Math.min(availW / COLS, availH / ROWS));
      CELL = Math.max(16, Math.min(CELL, 34));
    } else {
      CELL = 38;
    }
    canvas.width = COLS * CELL;
    canvas.height = ROWS * CELL;
  }
  computeCell();

  const COLORS = {
    I: '#00e5ff',
    O: '#ffe600',
    T: '#c400ff',
    S: '#00ff85',
    Z: '#ff2e5e',
    J: '#2e6bff',
    L: '#ff8c1a'
  };

  const SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    T: [[1,0],[0,1],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]],
    J: [[0,0],[0,1],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]]
  };

  function rotateCells(cells, pivot){
    // rotate 90deg clockwise around pivot (approx center)
    return cells.map(([x,y]) => {
      const rx = pivot[0] + (pivot[1] - y);
      const ry = pivot[1] + (x - pivot[0]);
      return [rx, ry];
    });
  }

  function makePiece(type){
    const cells = SHAPES[type].map(c => c.slice());
    return { type, cells, x: 3, y: -1, color: COLORS[type] };
  }

  const bagOrder = () => {
    const bag = Object.keys(SHAPES);
    for (let i = bag.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [bag[i], bag[j]] = [bag[j], bag[i]];
    }
    return bag;
  };

  let bag = [];
  function nextFromBag(){
    if (bag.length === 0) bag = bagOrder();
    return bag.pop();
  }

  let grid, current, nextType, score, level, lines, dropInterval, dropTimer, lastTime, gameOver, paused, animId;
  let sessionBest = 0;

  function init(){
    grid = Array.from({length: ROWS}, () => Array(COLS).fill(null));
    score = 0; level = 1; lines = 0;
    dropInterval = 800;
    dropTimer = 0; lastTime = 0;
    gameOver = false; paused = false;
    bag = [];
    nextType = nextFromBag();
    spawn();
    updateStats();
    hideOverlay();
    if (animId) cancelAnimationFrame(animId);
    animId = requestAnimationFrame(loop);
    requestWakeLock();
  }

  function spawn(){
    const type = nextType;
    nextType = nextFromBag();
    current = makePiece(type);
    if (collides(current.cells, current.x, current.y)) {
      gameOver = true;
      showOverlay('GAME OVER', 'Score: ' + score, null);
      releaseWakeLock();
      setTimeout(() => { init(); }, 1400);
    }
    // Next-piece preview removed from UI, but nextType still drives spawn order
  }

  function collides(cells, ox, oy){
    for (const [cx, cy] of cells) {
      const x = ox + cx, y = oy + cy;
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && grid[y][x]) return true;
    }
    return false;
  }

  function merge(){
    for (const [cx, cy] of current.cells) {
      const x = current.x + cx, y = current.y + cy;
      if (y >= 0) grid[y][x] = current.color;
    }
  }

  function clearLines(){
    let cleared = 0;
    for (let y = ROWS - 1; y >= 0; y--) {
      if (grid[y].every(cell => cell)) {
        grid.splice(y, 1);
        grid.unshift(Array(COLS).fill(null));
        cleared++;
        y++;
      }
    }
    if (cleared > 0) {
      const points = [0, 100, 300, 500, 800][cleared] * level;
      score += points;
      lines += cleared;
      level = Math.floor(lines / 10) + 1;
      dropInterval = Math.max(100, 800 - (level - 1) * 65);
      updateStats();
    }
  }

  function move(dx){
    if (gameOver || paused) return;
    if (!collides(current.cells, current.x + dx, current.y)) {
      current.x += dx;
    }
  }

  function softDrop(){
    if (gameOver || paused) return;
    if (!collides(current.cells, current.x, current.y + 1)) {
      current.y += 1;
      score += 1;
      updateStats();
    } else {
      lockPiece();
    }
    dropTimer = 0;
  }

  function hardDrop(){
    if (gameOver || paused) return;
    let dist = 0;
    while (!collides(current.cells, current.x, current.y + 1)) {
      current.y += 1;
      dist++;
    }
    score += dist * 2;
    lockPiece();
    updateStats();
  }

  function lockPiece(){
    merge();
    clearLines();
    spawn();
    dropTimer = 0;
  }

  function rotate(){
    if (gameOver || paused) return;
    if (current.type === 'O') return;
    let pivot = current.type === 'I' ? [1.5, 1] : [1, 1];
    const rotated = rotateCells(current.cells, pivot).map(([x,y]) => [Math.round(x), Math.round(y)]);
    const kicks = [0, -1, 1, -2, 2];
    for (const k of kicks) {
      if (!collides(rotated, current.x + k, current.y)) {
        current.cells = rotated;
        current.x += k;
        return;
      }
    }
  }

  function updateStats(){
    document.getElementById('score').textContent = score;
    const bestEl = document.getElementById('best');
    if (score > sessionBest) {
      sessionBest = score;
      bestEl.textContent = sessionBest;
      bestEl.classList.remove('newBest');
      void bestEl.offsetWidth; // restart animation
      bestEl.classList.add('newBest');
    }
  }

  function drawCell(c, x, y, color, alpha){
    c.save();
    c.globalAlpha = alpha === undefined ? 1 : alpha;
    const px = x * CELL, py = y * CELL;
    const grad = c.createLinearGradient(px, py, px + CELL, py + CELL);
    grad.addColorStop(0, color);
    grad.addColorStop(1, shade(color, -25));
    c.fillStyle = grad;
    c.fillRect(px + 1, py + 1, CELL - 2, CELL - 2);
    c.strokeStyle = 'rgba(255,255,255,0.35)';
    c.lineWidth = 1;
    c.strokeRect(px + 1.5, py + 1.5, CELL - 3, CELL - 3);
    c.restore();
  }

  function shade(hex, percent){
    const num = parseInt(hex.slice(1), 16);
    let r = (num >> 16) + Math.round(2.55 * percent);
    let g = ((num >> 8) & 0x00FF) + Math.round(2.55 * percent);
    let b = (num & 0x0000FF) + Math.round(2.55 * percent);
    r = Math.max(0, Math.min(255, r));
    g = Math.max(0, Math.min(255, g));
    b = Math.max(0, Math.min(255, b));
    return '#' + (0x1000000 + r*0x10000 + g*0x100 + b).toString(16).slice(1);
  }

  function ghostY(){
    let gy = current.y;
    while (!collides(current.cells, current.x, gy + 1)) gy++;
    return gy;
  }

  function draw(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // grid backdrop lines
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL, canvas.height); ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(canvas.width, y*CELL); ctx.stroke();
    }
    // settled blocks
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (grid[y][x]) drawCell(ctx, x, y, grid[y][x]);
      }
    }
    if (!gameOver) {
      // ghost
      const gy = ghostY();
      for (const [cx, cy] of current.cells) {
        const y = gy + cy;
        if (y >= 0) drawCell(ctx, current.x + cx, y, current.color, 0.2);
      }
      // current
      for (const [cx, cy] of current.cells) {
        const y = current.y + cy;
        if (y >= 0) drawCell(ctx, current.x + cx, y, current.color);
      }
    }
  }

  function loop(t){
    if (!lastTime) lastTime = t;
    const delta = t - lastTime;
    lastTime = t;
    if (!paused && !gameOver) {
      dropTimer += delta;
      if (dropTimer > dropInterval) {
        if (!collides(current.cells, current.x, current.y + 1)) {
          current.y += 1;
        } else {
          lockPiece();
        }
        dropTimer = 0;
      }
      draw();
    }
    animId = requestAnimationFrame(loop);
  }

  function showOverlay(title, sub, btnText){
    const ov = document.getElementById('overlay');
    const btn = document.getElementById('overlayBtn');
    document.getElementById('overlayTitle').textContent = title;
    document.getElementById('overlaySub').textContent = sub;
    if (btnText) {
      btn.textContent = btnText;
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
    ov.style.display = 'flex';
  }
  function hideOverlay(){
    document.getElementById('overlay').style.display = 'none';
  }

  function togglePause(){
    if (gameOver) return;
    paused = !paused;
    if (paused) {
      showOverlay('PAUSED', isMobile ? 'Tap resume to continue' : 'Press P to resume', 'RESUME');
      releaseWakeLock();
    } else {
      hideOverlay();
      requestWakeLock();
    }
  }

  document.getElementById('overlayBtn').addEventListener('click', () => {
    if (gameOver) { init(); }
    else { togglePause(); }
  });

  window.addEventListener('keydown', (e) => {
    switch(e.code) {
      case 'ArrowLeft':
      case 'KeyA': move(-1); e.preventDefault(); break;
      case 'ArrowRight':
      case 'KeyD': move(1); e.preventDefault(); break;
      case 'ArrowDown':
      case 'KeyS': softDrop(); e.preventDefault(); break;
      case 'KeyR': rotate(); e.preventDefault(); break;
      case 'Space': hardDrop(); e.preventDefault(); break;
      case 'KeyP': togglePause(); e.preventDefault(); break;
    }
  });

  // ---- Touch controls: swipe gestures on the board itself ----
  const SWIPE_MOVE_THRESHOLD = 24;      // px, horizontal distance to register a column move
  const SWIPE_DROP_THRESHOLD = 18;      // px, vertical distance to register a soft-drop step
  const HARD_DROP_VELOCITY = 1.1;       // px/ms downward speed to count as a hard drop flick
  const HARD_DROP_DISTANCE = 90;        // px, minimum downward distance for a fast flick
  const TAP_MAX_MOVEMENT = 12;          // px, max movement to still count as a tap (rotate)
  const TAP_MAX_DURATION = 250;         // ms, max duration to still count as a tap

  let touchState = null;

  function onTouchStart(e){
    if (!isMobile || gameOver) return;
    const t = e.changedTouches[0];
    touchState = {
      startX: t.clientX, startY: t.clientY,
      lastX: t.clientX, lastY: t.clientY,
      startTime: performance.now(),
      lastMoveTime: performance.now(),
      movedCols: 0, movedRows: 0
    };
    e.preventDefault();
  }

  function onTouchMove(e){
    if (!touchState || paused || gameOver) return;
    const t = e.changedTouches[0];
    const now = performance.now();
    const dx = t.clientX - touchState.lastX;
    const dy = t.clientY - touchState.lastY;

    // Horizontal: move one column per threshold crossed
    if (Math.abs(dx) >= SWIPE_MOVE_THRESHOLD) {
      const dir = dx > 0 ? 1 : -1;
      move(dir);
      touchState.lastX = t.clientX;
      touchState.movedCols += Math.abs(dir);
    }
    // Vertical (downward only): soft-drop one row per threshold crossed
    if (dy >= SWIPE_DROP_THRESHOLD) {
      softDrop();
      touchState.lastY = t.clientY;
      touchState.movedRows += 1;
    }
    touchState.lastMoveTime = now;
    e.preventDefault();
  }

  function onTouchEnd(e){
    if (!touchState || gameOver) { touchState = null; return; }
    const t = e.changedTouches[0];
    const now = performance.now();
    const totalDx = t.clientX - touchState.startX;
    const totalDy = t.clientY - touchState.startY;
    const duration = now - touchState.startTime;
    const distance = Math.hypot(totalDx, totalDy);

    if (!paused) {
      // Fast downward flick -> hard drop (checked by distance+velocity, or big fast raw swipe)
      const downVelocity = totalDy > 0 ? (totalDy / Math.max(duration, 1)) : 0;
      if (totalDy > HARD_DROP_DISTANCE && downVelocity > HARD_DROP_VELOCITY) {
        hardDrop();
      } else if (distance <= TAP_MAX_MOVEMENT && duration <= TAP_MAX_DURATION) {
        // Tap with negligible movement -> rotate
        rotate();
      }
    }
    touchState = null;
    e.preventDefault();
  }

  canvas.addEventListener('touchstart', onTouchStart, { passive: false });
  canvas.addEventListener('touchmove', onTouchMove, { passive: false });
  canvas.addEventListener('touchend', onTouchEnd, { passive: false });
  canvas.addEventListener('touchcancel', () => { touchState = null; }, { passive: false });

  // Prevent double-tap-to-zoom on the board (belt-and-suspenders alongside touch-action:none)
  let lastTapTime = 0;
  canvas.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTapTime < 300) e.preventDefault();
    lastTapTime = now;
  }, { passive: false });

  document.getElementById('tPause').addEventListener('click', togglePause);
  document.getElementById('tPause').addEventListener('touchstart', (e) => { e.preventDefault(); togglePause(); }, { passive: false });

  // ---- Screen Wake Lock: keep screen on during active play ----
  let wakeLock = null;
  async function requestWakeLock(){
    if (!('wakeLock' in navigator)) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
    } catch (err) {
      // Fails silently (e.g. low battery, unsupported) — never block gameplay
      wakeLock = null;
    }
  }
  function releaseWakeLock(){
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !paused && !gameOver) {
      requestWakeLock();
    }
  });

  // ---- Refit board on resize / orientation change (mobile) ----
  let resizeTimer;
  window.addEventListener('resize', () => {
    if (!isMobile) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      computeCell();
      draw();
    }, 150);
  });

  init();
})();
</script>
</body>
</html>
